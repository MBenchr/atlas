<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas NEXORA V3 · Cockpit d'architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div>
          <h1>Atlas NEXORA V3 · Cockpit d'architecture</h1>
          <p id="subtitle">Architecture claire: qui décide, qui projette, qui consomme.</p>
        </div>
        <div class="meta">
          <div class="meta-actions">
            <button id="atlas-refresh-btn" class="refresh-btn" type="button" title="Regénérer les données Atlas">Mettre à jour</button>
            <button id="help-mode-toggle" class="help-toggle" type="button">Aide: OFF</button>
          </div>
          <div class="meta-status">
            <div id="generated-at">Généré: -</div>
            <div id="freshness-status" class="pill">Fraicheur: chargement...</div>
            <div id="data-health" class="pill">Statut: chargement...</div>
            <div id="active-alerts-status" class="pill">Alertes actives: -</div>
            <div id="scope-status" class="pill">Scope: -</div>
            <div id="period-status" class="pill">Période: -</div>
          </div>
        </div>
      </header>

      <div class="shell">
        <aside id="nav" class="nav"></aside>
        <main id="view" class="view"></main>
      </div>

      <div id="detail-overlay" class="detail-overlay" aria-hidden="true">
        <aside id="detail-panel" class="detail-panel">
          <div class="detail-panel-header">
            <h3>Détail pédagogique</h3>
            <button id="detail-close" class="detail-close" type="button" aria-label="Fermer">✕</button>
          </div>
          <div id="detail-body">Clique sur un élément du site pour afficher son explication.</div>
        </aside>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
